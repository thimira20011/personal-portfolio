<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Thimira portfolio sharing preview</title>
  <style>
    @font-face { font-family: Manrope; src: url('/fonts/manrope-latin-variable.woff2'); font-weight: 200 800; }
    @font-face { font-family: Bricolage; src: url('/fonts/bricolage-grotesque-latin-variable.woff2'); font-weight: 200 800; }
    * { box-sizing: border-box; }
    body { width: 1200px; height: 630px; margin: 0; padding: 48px 64px 32px; background: #171714; color: #eee5d5; font-family: Manrope, sans-serif; }
    header { font-family: Bricolage, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
    header span { color: #c4f464; }
    main { display: flex; align-items: center; height: 442px; }
    .intro { width: 620px; flex-shrink: 0; position: relative; z-index: 1; }
    h1 { margin: 0 0 24px; font-family: Bricolage, sans-serif; font-size: 60px; font-weight: 600; letter-spacing: -.035em; line-height: 1.08; }
    h1 span { display: block; color: #c3a47d; }
    .role { margin: 0 0 20px; font-size: 25px; font-weight: 600; }
    .focus { margin: 0; color: #bfb39e; font-size: 21px; line-height: 1.6; }
    img { width: 500px; height: auto; margin-left: -48px; }
    footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #444236; padding-top: 24px; font-size: 18px; }
    footer span { color: #bfb39e; }
    footer strong { color: #c4f464; font-weight: 600; }
  </style>
</head>
<body>
  <header>Thimira<span>.</span></header>
  <main>
    <div class="intro">
      <h1>Thimira Niranjaya<span>Keerthiwansha</span></h1>
      <p class="role">Full-Stack &amp; .NET Engineer</p>
      <p class="focus">Backend systems · Cloud infrastructure · AI</p>
    </div>
    <img src="/images/pixel-workspace.webp" width="960" height="640" alt="Pixel developer workspace">
  </main>
  <footer><strong>www.thimira.tech</strong><span>Selected engineering work &amp; project stories</span></footer>
</body>
</html>
